apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: prod
patches:
  - target:
      kind: Namespace
      name: shoplab
    patch: |-
      - op: replace
        path: /metadata/name
        value: shoplab-prod
  - target:
      kind: Application
      name: shoplab
    patch: |-
      - op: replace
        path: /metadata/name
        value: shoplab-prod
      - op: replace
        path: /spec/source/path
        value: kubernetes/overlays/prod
      - op: replace
        path: /spec/destination/namespace
        value: shoplab-prod
