apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: staging
patches:
  - target:
      kind: Namespace
      name: shoplab
    patch: |-
      - op: replace
        path: /metadata/name
        value: shoplab-staging
  - target:
      kind: Application
      name: shoplab
    patch: |-
      - op: replace
        path: /metadata/name
        value: shoplab-staging
      - op: replace
        path: /spec/source/path
        value: kubernetes/overlays/staging
      - op: replace
        path: /spec/destination/namespace
        value: shoplab-staging
