apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shoplab
spec:
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      initContainers:
        - name: init
          image: registry.example.com:5000/init:2.1.0
      containers:
        - name: api
          image: ghcr.io/example/api@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example/shoplab-i
    nfra
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: shoplab
