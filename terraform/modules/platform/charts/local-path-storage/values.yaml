provisionerImage: rancher/local-path-provisioner:v0.0.31
helperImage: busybox:1.37.0
# Directorio del nodo donde se crean los volúmenes. El nodo es un contenedor desechable y solo /var/lib/rancher/k3s está
# en un volumen de Docker: fuera de ahí, los datos se pierden cuando Floci recrea el contenedor.
nodePath: /var/lib/rancher/k3s/storage
