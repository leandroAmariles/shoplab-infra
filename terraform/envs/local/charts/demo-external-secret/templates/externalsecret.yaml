apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-postgres
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: demo-postgres
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.remoteKey }}
