# Emulador de AWS local (Floci, licencia MIT). Imagen fijada: nunca :latest.
# El nombre del proyecto fija el de la red (shoplab-infra_default), que usa scripts/floci-ip.sh.
name: shoplab-infra

services:
  floci:
    image: floci/floci:2.3.0
    container_name: shoplab-floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: localhost
      FLOCI_SERVICES_EKS_DEFAULT_IMAGE: rancher/k3s:v1.35.9-k3s1
      # Floci solo levanta su consola como sidecar la primera vez que alguien abre /_floci/ui, y ese contenedor muere con
      # él: tras cada recreación el puerto 4500 quedaba vacío. Se desactiva y la consola corre como servicio de compose.
      FLOCI_SERVICES_UI_ENABLED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Consola web de Floci, siempre arriba junto al emulador (http://localhost:4500). Misma imagen que usaría el sidecar.
  floci-ui:
    image: floci/floci-ui:0.7.0
    container_name: shoplab-floci-ui
    ports:
      - "4500:4500"
    environment:
      # Dentro de la red de compose el emulador se llama "floci"; con localhost la consola se llamaría a sí misma.
      FLOCI_ENDPOINT: http://floci:4566
    depends_on:
      - floci
    restart: unless-stopped
