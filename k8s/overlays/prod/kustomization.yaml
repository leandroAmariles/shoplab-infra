apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shoplab-prod
resources:
  - ../../base
  - namespace.yaml
  - hpa.yaml
labels:
  - pairs:
      app.kubernetes.io/environment: prod
images:
  # Digest de la imagen construida desde main (e11f73d). Los tags vX.Y.Z aún no existen en GHCR; cuando se publiquen
  # (LAB-78) se promueve cada ambiente con newTag. Nunca latest.
  - name: ghcr.io/leandroamariles/backend
    digest: sha256:0566c4464e4819549acdf6be9f538703197ac7ea7dbcd01e481fadafa3b5614d
  - name: ghcr.io/leandroamariles/frontend
    digest: sha256:277b6289ef14fbe341cfff55e71604892add02c1c097dc6f2b2ec922753efd62
  - name: ghcr.io/leandroamariles/ingest
    digest: sha256:573339322d509d42ea804051bb206b85e2864e57b7806428712c50af3aa92e4b
configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - LOGGING_LEVEL_ROOT=INFO
patches:
  - path: patches/resources.yaml
  - target:
      kind: Ingress
      name: shoplab
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: shoplab.example
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 50Gi
  - target:
      kind: StatefulSet
      name: ollama
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 40Gi
  # Cada ambiente lee solo sus propias claves de Secrets Manager.
  - target:
      kind: ExternalSecret
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: /shoplab/prod/postgres-password
