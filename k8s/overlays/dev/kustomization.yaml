apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shoplab-dev
resources:
  - ../../base
  - namespace.yaml
  - hpa.yaml
labels:
  - pairs:
      app.kubernetes.io/environment: dev
images:
  # Tag de versión liberada (inmutable en GHCR); nunca latest.
  - name: ghcr.io/leandroamariles/backend
    newTag: latest
  - name: ghcr.io/leandroamariles/frontend
    newTag: v0.1.1
  - name: ghcr.io/leandroamariles/ingest
    newTag: v0.1.1
configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - LOGGING_LEVEL_ROOT=DEBUG
patches:
  - path: patches/resources.yaml
  - target:
      kind: Ingress
      name: shoplab
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: shoplab.localtest.me
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
  - target:
      kind: StatefulSet
      name: ollama
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 10Gi
  # Cada ambiente lee solo sus propias claves de Secrets Manager.
  - target:
      kind: ExternalSecret
    patch: |-
      - op: replace
        path: /spec/data/0/remoteRef/key
        value: /shoplab/dev/postgres-password
