# Desde LAB-81 el despliegue continuo (job deploy de shoplab-helpdesk) fija en `images:` el `newTag` con la versión
# vX.Y.Z de cada release (ADR-0012 de shoplab-helpdesk); no se edita a mano. Para volver atrás, revierte el commit de despliegue. Nunca latest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shoplab-dev
resources:
- ../../base
- namespace.yaml
- hpa.yaml
- ollama-host.yaml
- postgres-host.yaml
labels:
- pairs:
    app.kubernetes.io/environment: dev
images:
- name: ghcr.io/leandroamariles/backend
  newName: ghcr.io/leandroamariles/backend
  newTag: v0.17.0
- name: ghcr.io/leandroamariles/frontend
  newName: ghcr.io/leandroamariles/frontend
  newTag: v0.17.0
- name: ghcr.io/leandroamariles/ingest
  newName: ghcr.io/leandroamariles/ingest
  newTag: v0.17.0
  # Trazas de LLM hacia el Langfuse del clúster (LAB-64); las claves vienen de backend-langfuse.
configMapGenerator:
- behavior: merge
  literals:
  - LOGGING_LEVEL_ROOT=DEBUG
  - SHOPLAB_CHAT_TRACING_ENABLED=true
  - SHOPLAB_CHAT_TRACING_ENDPOINT=http://langfuse-web:3000/api/public/otel
  - SHOPLAB_CHAT_TRACING_ENVIRONMENT=dev
  name: backend-config
# Postgres corre en el Docker del host (ver postgres-host.yaml), con su volumen propio: los datos sobreviven a make down.
# Se quitan el StatefulSet, su configuración y su ExternalSecret (el backend tiene el suyo), y el Service `postgres` pasa
# a no tener selector para que lo sirva el EndpointSlice del host.
# Ollama corre en el Docker del host (ver ollama-host.yaml): se quitan el StatefulSet y su configuración, y el Service
# `ollama` pasa a no tener selector para que lo sirva el EndpointSlice del host.
# Langfuse (LAB-64): los secretos salen de /shoplab/dev/langfuse. `langfuse-credentials` usa dataFrom (sin /spec/data) y
# `backend-langfuse` lee dos propiedades del mismo JSON.
patches:
- path: patches/resources.yaml
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: shoplab.localtest.me
  target:
    kind: Ingress
    name: shoplab
- patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: postgres
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: postgres-config
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: postgres-init
- patch: |-
    $patch: delete
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: postgres-credentials
- patch: |-
    - op: remove
      path: /spec/selector
  target:
    kind: Service
    name: postgres
- patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: ollama
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ollama-config
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ollama-entrypoint
- patch: |-
    - op: remove
      path: /spec/selector
  target:
    kind: Service
    name: ollama
- patch: |-
    - op: replace
      path: /spec/data/0/remoteRef/key
      value: /shoplab/dev/postgres-password
  target:
    kind: ExternalSecret
    name: backend-credentials
- patch: |-
    - op: replace
      path: /spec/dataFrom/0/extract/key
      value: /shoplab/dev/langfuse
  target:
    kind: ExternalSecret
    name: langfuse-credentials
- patch: |-
    - op: replace
      path: /spec/data/0/remoteRef/key
      value: /shoplab/dev/langfuse
    - op: replace
      path: /spec/data/1/remoteRef/key
      value: /shoplab/dev/langfuse
  target:
    kind: ExternalSecret
    name: backend-langfuse
