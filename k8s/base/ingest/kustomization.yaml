apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
# ingest no se conecta a Postgres: entrega su salida al modulo retrieval del backend, unico dueno del esquema
# (LAB-19, ADR-0015). Por eso no lleva ExternalSecret ni variables DATABASE_*.
configMapGenerator:
  - name: ingest-config
    literals:
      - OLLAMA_BASE_URL=http://ollama:11434
