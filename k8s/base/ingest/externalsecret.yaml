apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ingest-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: ingest-credentials
  data:
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: /shoplab/ENVIRONMENT/postgres-password
