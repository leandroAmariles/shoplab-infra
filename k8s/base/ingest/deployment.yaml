apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  labels:
    app.kubernetes.io/name: ingest
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: ingest
          image: ghcr.io/leandroamariles/ingest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ingest-config
          # La imagen aun no expone un endpoint de salud: se comprueba el puerto hasta que lo tenga.
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
