# Crea o actualiza las claves virtuales de keys.yaml tras cada sincronización de Argo CD (hook PostSync) y termina. Es
# idempotente: tras `destroy` y `apply` recrea las claves y sus presupuestos sin pasos manuales (FR-034). Los valores de las
# claves llegan del Secret `litellm-credentials`; en `dev` rechaza valores de marcador (change-me / local).
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-bootstrap-keys
  labels:
    app.kubernetes.io/name: litellm-bootstrap-keys
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-bootstrap-keys
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: bootstrap
          image: ghcr.io/berriai/litellm:v1.109.1
          command: ["python", "/app/shoplab/bootstrap_keys.py", "/app/shoplab/keys.yaml"]
          env:
            - name: LITELLM_BASE_URL
              value: http://litellm:4000
            - name: GATEWAY_ENVIRONMENT
              value: dev
            - name: BOOTSTRAP_TIMEOUT
              value: "300"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: LITELLM_MASTER_KEY
            - name: LITELLM_KEY_BACKEND
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: LITELLM_KEY_BACKEND
            - name: LITELLM_KEY_INGEST
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: LITELLM_KEY_INGEST
            # Clave de la evaluacion de calidad de respuesta (LAB-29): solo llama a `judge` y `embeddings`. Es obligatoria:
            # el bootstrap aborta si falta la variable de una clave de keys.yaml (`make secrets` la anade al secreto local).
            - name: LITELLM_KEY_EVAL
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: LITELLM_KEY_EVAL
            # retrieval-service (LAB-129): embeddings de documentos y consultas.
            - name: LITELLM_KEY_RETRIEVAL
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: LITELLM_KEY_RETRIEVAL
            - name: CLOUD_PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-credentials
                  key: CLOUD_PROVIDER_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: files
              mountPath: /app/shoplab
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: files
          configMap:
            name: litellm-files
        - name: tmp
          emptyDir: {}
