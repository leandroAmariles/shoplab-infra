# Redes del gateway (LAB-84, FR-002 y FR-035): solo los servicios que llaman a modelos, `ingest` y el Job de claves llegan a `litellm`; solo `litellm`
# llega a su Postgres y al pod de Ollama cuando Ollama corre en el clúster. El gateway no tiene Ingress.
# En `dev` Ollama es externo (Docker del host): ahí la salida de esos pods hacia él se corta en el overlay.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ingest
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: retrieval-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm-bootstrap-keys
      ports:
        - port: 4000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-postgres-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-ingress-only-from-litellm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollama
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 11434
          protocol: TCP
