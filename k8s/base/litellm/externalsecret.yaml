# Las credenciales del gateway viven en un solo secreto JSON de Secrets Manager (/shoplab/<ambiente>/litellm); cada clave del
# JSON se convierte en una clave del Secret `litellm-credentials`: LITELLM_MASTER_KEY, LITELLM_KEY_BACKEND,
# LITELLM_KEY_INGEST, POSTGRES_PASSWORD y, opcional, CLOUD_PROVIDER_API_KEY (sin ella el modelo `chat-cloud` no existe).
# El overlay sustituye ENVIRONMENT por el ambiente.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: litellm-credentials
  dataFrom:
    - extract:
        key: /shoplab/ENVIRONMENT/litellm
