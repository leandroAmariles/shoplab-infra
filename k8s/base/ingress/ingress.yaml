# El host es un marcador: cada overlay lo sustituye. Ingest no se publica (uso interno).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shoplab
  labels:
    app.kubernetes.io/name: ingress
  annotations:
    # Subida de documentos (LAB-25): el backend acepta hasta 10 MiB por documento y el multipart añade cabeceras.
    # Con el 1m por defecto de ingress-nginx, un PDF mediano recibiría un 413 sin el contrato de errores.
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
spec:
  ingressClassName: nginx
  rules:
    - host: shoplab.invalid
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
