# Las diez claves de Langfuse viven en un solo secreto JSON de Secrets Manager (/shoplab/<ambiente>/langfuse); cada clave del JSON
# se convierte en una clave del Secret `langfuse-credentials`. El overlay sustituye ENVIRONMENT por el ambiente.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: langfuse-credentials
  dataFrom:
    - extract:
        key: /shoplab/ENVIRONMENT/langfuse
