# Almacenamiento S3 de Langfuse (LAB-64). Imagen por digest del índice multi-arquitectura (Chainguard no publica versiones fijas gratuitas).
# El bucket `langfuse` es el directorio /data/langfuse. HOME=/tmp: `mc ready` escribe su configuración ahí.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-minio
  labels:
    app.kubernetes.io/name: langfuse-minio
spec:
  serviceName: langfuse-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-minio
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio@sha256:fb893e36fc369d41e92f678b17ec27378fa5bf0576aeef7ac15460c13629ab5a
          command:
            - sh
            - -c
            - mkdir -p /data/langfuse && exec minio server --address :9000 --console-address :9001 /data
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: HOME
              value: /tmp
            - name: MINIO_ROOT_USER
              value: minio
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-credentials
                  key: MINIO_ROOT_PASSWORD
          readinessProbe:
            exec:
              command: [mc, ready, local]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [mc, ready, local]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-minio
  labels:
    app.kubernetes.io/name: langfuse-minio
spec:
  selector:
    app.kubernetes.io/name: langfuse-minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
