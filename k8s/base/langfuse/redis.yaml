# Caché y colas de Langfuse (LAB-64). Sin expulsión de claves: las colas no pueden perder trabajo.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-redis
  labels:
    app.kubernetes.io/name: langfuse-redis
spec:
  serviceName: langfuse-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: docker.io/redis:7.4.6
          command: [sh, -c, "exec redis-server --requirepass \"$REDIS_AUTH\" --maxmemory-policy noeviction"]
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_AUTH
              valueFrom:
                secretKeyRef:
                  name: langfuse-credentials
                  key: REDIS_AUTH
          readinessProbe:
            exec:
              command: [sh, -c, "redis-cli --no-auth-warning -a \"$REDIS_AUTH\" ping | grep -q PONG"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, "redis-cli --no-auth-warning -a \"$REDIS_AUTH\" ping | grep -q PONG"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-redis
  labels:
    app.kubernetes.io/name: langfuse-redis
spec:
  selector:
    app.kubernetes.io/name: langfuse-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
