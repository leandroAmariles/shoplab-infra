# Interfaz y API de Langfuse (LAB-64). Sin Ingress: se accede por `kubectl port-forward svc/langfuse-web 3001:3000`, por eso
# NEXTAUTH_URL es http://localhost:3001. Las claves LANGFUSE_INIT_* crean organización, proyecto y usuario al arrancar.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  labels:
    app.kubernetes.io/name: langfuse-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: web
          image: docker.langfuse.com/langfuse/langfuse:4.77.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-credentials
                  key: POSTGRES_PASSWORD
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-credentials
                  key: CLICKHOUSE_PASSWORD
            - name: REDIS_AUTH
              valueFrom:
                secretKeyRef:
                  name: langfuse-credentials
                  key: REDIS_AUTH
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: langfuse-credentials
                  key: SALT
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-credentials
                  key: ENCRYPTION_KEY
            - name: DATABASE_URL
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@langfuse-postgres:5432/postgres"
            - name: CLICKHOUSE_MIGRATION_URL
              value: "clickhouse://langfuse-clickhouse:9000"
            - name: CLICKHOUSE_URL
              value: "http://langfuse-clickhouse:8123"
            - name: CLICKHOUSE_USER
              value: "clickhouse"
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: "false"
            - name: REDIS_HOST
              value: "langfuse-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_TLS_ENABLED
              value: "false"
            - name: TELEMETRY_ENABLED
              value: "false"
            - name: NEXTAUTH_URL
              value: "http://localhost:3001"
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              value: "langfuse"
            - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
              value: "auto"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              value: "minio"
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              value: "http://langfuse-minio:9000"
            - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
              value: "true"
            - name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX
              value: "events/"
            - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
              value: "langfuse"
            - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
              value: "auto"
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
              value: "minio"
            - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
              value: "http://langfuse-minio:9000"
            - name: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE
              value: "true"
            - name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX
              value: "media/"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: langfuse-credentials
                  key: NEXTAUTH_SECRET
            - name: LANGFUSE_INIT_ORG_ID
              value: "shoplab"
            - name: LANGFUSE_INIT_ORG_NAME
              value: "ShopLab"
            - name: LANGFUSE_INIT_PROJECT_ID
              value: "shoplab-helpdesk"
            - name: LANGFUSE_INIT_PROJECT_NAME
              value: "shoplab-helpdesk"
            - name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-credentials
                  key: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
            - name: LANGFUSE_INIT_PROJECT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-credentials
                  key: LANGFUSE_INIT_PROJECT_SECRET_KEY
            - name: LANGFUSE_INIT_USER_EMAIL
              value: "admin@shoplab.local"
            - name: LANGFUSE_INIT_USER_NAME
              value: "admin"
            - name: LANGFUSE_INIT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-credentials
                  key: LANGFUSE_INIT_USER_PASSWORD
          startupProbe:
            httpGet:
              path: /api/public/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
  labels:
    app.kubernetes.io/name: langfuse-web
spec:
  selector:
    app.kubernetes.io/name: langfuse-web
  ports:
    - name: http
      port: 3000
      targetPort: http
