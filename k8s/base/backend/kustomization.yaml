apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - externalsecret.yaml
  - externalsecret-langfuse.yaml
  - externalsecret-litellm.yaml
  - externalsecret-eval.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
configMapGenerator:
  - name: backend-config
    literals:
      # Spring Boot activa los grupos de sondas en Kubernetes; se fuerza para no depender de la deteccion.
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shoplab
      - SPRING_DATASOURCE_USERNAME=shoplab
      # Todas las llamadas a modelos pasan por el gateway (LAB-84); el backend ya no conoce a Ollama. La clave virtual
      # viene de backend-litellm.
      - SPRING_AI_OPENAI_BASE_URL=http://litellm:4000/v1
      # El chat busca en la base de conocimiento de retrieval-service (LAB-129).
      - SHOPLAB_RETRIEVAL_CLIENT_BASE_URL=http://retrieval-service:8080
      - LOGGING_LEVEL_ROOT=INFO
