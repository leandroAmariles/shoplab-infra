apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - externalsecret.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
configMapGenerator:
  - name: backend-config
    literals:
      # Spring Boot activa los grupos de sondas en Kubernetes; se fuerza para no depender de la deteccion.
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/shoplab
      - SPRING_DATASOURCE_USERNAME=shoplab
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - LOGGING_LEVEL_ROOT=INFO
