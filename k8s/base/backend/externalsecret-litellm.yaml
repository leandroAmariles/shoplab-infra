# Clave virtual con la que el backend llama al gateway de modelos (LAB-84). Sale del mismo secreto JSON que usa el gateway
# para crear sus claves (/shoplab/<ambiente>/litellm), así que no hay nada que copiar a mano.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: backend-litellm
  data:
    - secretKey: SPRING_AI_OPENAI_API_KEY
      remoteRef:
        key: /shoplab/ENVIRONMENT/litellm
        property: LITELLM_KEY_BACKEND
