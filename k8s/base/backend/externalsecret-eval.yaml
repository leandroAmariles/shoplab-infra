# Token con el que la herramienta de evaluación (`eval/` de shoplab-helpdesk) guarda cada ejecución en el historial del
# backend (LAB-31, shoplab.eval.persistence.token). Sale del secreto JSON /shoplab/<ambiente>/eval, así que no hay nada que
# copiar a mano; `make secrets` lo genera. Es opcional: el envFrom del backend lo declara `optional`, y sin él el backend
# arranca igual y rechaza guardar ejecuciones (403).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-eval
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: backend-eval
  data:
    - secretKey: SHOPLAB_EVAL_PERSISTENCE_TOKEN
      remoteRef:
        key: /shoplab/ENVIRONMENT/eval
        property: EVAL_PERSISTENCE_TOKEN
