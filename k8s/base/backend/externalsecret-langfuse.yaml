# Claves del proyecto de Langfuse con las que el backend envía sus trazas (LAB-64). Salen del mismo secreto JSON que usa
# Langfuse para crear el proyecto (/shoplab/<ambiente>/langfuse), así que no hay nada que copiar a mano.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: backend-langfuse
  data:
    - secretKey: SHOPLAB_CHAT_TRACING_PUBLIC_KEY
      remoteRef:
        key: /shoplab/ENVIRONMENT/langfuse
        property: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
    - secretKey: SHOPLAB_CHAT_TRACING_SECRET_KEY
      remoteRef:
        key: /shoplab/ENVIRONMENT/langfuse
        property: LANGFUSE_INIT_PROJECT_SECRET_KEY
