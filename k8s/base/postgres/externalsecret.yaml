# La contraseña vive en Secrets Manager; el overlay sustituye ENVIRONMENT por el ambiente (contrato de secretos).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: postgres-credentials
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /shoplab/ENVIRONMENT/postgres-password
