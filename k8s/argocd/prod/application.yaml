# Application de Argo CD que sincroniza el overlay prod desde este repositorio. El namespace de destino lo crea el
# propio overlay (namespace.yaml). Las politicas de CI exigen targetRevision: main y un repoURL sin el placeholder.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplab-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/leandroAmariles/shoplab-infra
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: shoplab-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
