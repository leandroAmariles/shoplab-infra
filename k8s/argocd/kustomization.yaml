# Applications que gestiona la raíz (root.yaml): el único ambiente (dev) y los dashboards de Grafana (observability). root.yaml NO se lista aquí: la raíz no se
# gestiona a sí misma (la crea Terraform) y listarla provocaría un bucle de autogestión con prune activo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - application-dev.yaml
  - application-observability.yaml
