# Dashboards de Grafana como código (LAB-102). Esta Application NO lee shoplab-infra: sincroniza infra/observability de
# shoplab-helpdesk, donde viven los JSON (una sola copia, la misma que monta docker compose). La gestiona la Application
# raíz (root.yaml) y se retira del clúster, con sus recursos, al quitarla de kustomization.yaml (finalizer). Los
# ConfigMaps se crean en `monitoring`, donde el sidecar de Grafana de kube-prometheus-stack los carga; el namespace ya
# existe (lo crea Terraform), por eso no usa CreateNamespace. ServerSideApply evita el límite de 256 KiB de la anotación
# de `kubectl apply` si un dashboard crece. Las políticas de CI exigen targetRevision: main, un repoURL sin el
# placeholder y el finalizer. Un cambio de dashboard fusionado en main de shoplab-helpdesk se aplica solo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplab-observability
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/leandroAmariles/shoplab-helpdesk
    targetRevision: main
    path: infra/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
