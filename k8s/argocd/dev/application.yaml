# Application de Argo CD que sincroniza el overlay dev desde este repositorio. El namespace de destino lo crea el
# propio overlay (namespace.yaml). Las politicas de CI exigen targetRevision: develop y un repoURL sin el placeholder.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shoplab-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/leandroAmariles/shoplab-infra
    targetRevision: develop
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: shoplab-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
