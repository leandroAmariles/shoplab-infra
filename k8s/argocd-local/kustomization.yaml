# Selección de ambientes del clúster local (Floci): solo dev. El nodo de k3s de Floci tiene ~2 CPU y no cabe más de
# un ambiente (dev, staging y prod juntos dejan decenas de pods Pending por falta de CPU). Parte de todas las
# Application de k8s/argocd y retira las de staging y prod, que siguen definidas y validadas en CI para un clúster
# real. La raíz (root.yaml) sincroniza este directorio.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../argocd
patches:
  - target:
      kind: Application
      name: shoplab-staging
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: shoplab-staging
  - target:
      kind: Application
      name: shoplab-prod
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: shoplab-prod
