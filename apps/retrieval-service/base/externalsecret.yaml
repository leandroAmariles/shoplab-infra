# Password of the role `retrieval` in PostgreSQL: the same one the database was provisioned with (RETRIEVAL_DB_PASSWORD
# of shoplab-helpdesk/infra/.env).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: retrieval-service-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: retrieval-service-db
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /shoplab/dev/retrieval-db-password
---
# Virtual key of this service at the model gateway, from the same JSON secret the gateway creates its keys from.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: retrieval-service-litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: retrieval-service-litellm
  data:
    - secretKey: SPRING_AI_OPENAI_API_KEY
      remoteRef:
        key: /shoplab/dev/litellm
        property: LITELLM_KEY_RETRIEVAL
