# Knowledge base: documents, vectors and search (LAB-129 of shoplab-helpdesk, repo shoplab-retrieval-service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: retrieval-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: retrieval-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: retrieval-service
          # The tag is set by the overlay; the deploy job of shoplab-retrieval-service updates it.
          image: ghcr.io/leandroamariles/retrieval-service
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: retrieval-service-config
            - secretRef:
                name: retrieval-service-db
            - secretRef:
                name: retrieval-service-litellm
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # Uploads are buffered on disk.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
