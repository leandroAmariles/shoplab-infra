# Dev of retrieval-service (LAB-129). `images:` is updated by the deploy job of shoplab-retrieval-service on every
# release; the name must be the full image name or that job refuses to update it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shoplab-dev

resources:
- ../../base
- networkpolicy.yaml

images:
- name: ghcr.io/leandroamariles/retrieval-service
  newName: ghcr.io/leandroamariles/retrieval-service
  newTag: v0.2.0
