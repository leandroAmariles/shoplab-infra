# Password of the role `catalog` in PostgreSQL
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-service-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: catalog-service-db
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /shoplab/dev/catalog-db-password
