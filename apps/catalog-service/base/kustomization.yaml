apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - externalsecret.yaml

commonLabels:
  app.kubernetes.io/name: catalog-service
  app.kubernetes.io/part-of: shoplab

configMapGenerator:
  - name: catalog-service-config
    literals:
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/catalog
      - POSTGRES_USER=catalog
      - LOGGING_LEVEL_ROOT=INFO
