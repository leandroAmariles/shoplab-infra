# Dev of catalog-service (LAB-113)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shoplab-dev

resources:
- ../../base
- networkpolicy.yaml

patches:
- patch: |-
    - op: add
      path: /spec/strategy
      value:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
  target:
    kind: Deployment
    name: catalog-service

images:
- name: ghcr.io/leandroamariles/catalog-service
  newName: ghcr.io/leandroamariles/catalog-service
  newTag: v0.1.0
