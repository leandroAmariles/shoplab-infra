# Evaluation run history and admin-eval API service (LAB-130, ADR-0035).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eval-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eval-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: eval-service
          # The tag is set by the overlay; the deploy job of shoplab-eval-service updates it.
          image: ghcr.io/leandroamariles/eval-service
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: eval-service-config
            - secretRef:
                name: eval-service-db
            - secretRef:
                name: eval-service-eval
                optional: true
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
