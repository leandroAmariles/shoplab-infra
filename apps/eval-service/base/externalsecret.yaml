# Password of the role `eval` in PostgreSQL: matches EVAL_DB_PASSWORD of shoplab-helpdesk/infra/.env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eval-service-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: eval-service-db
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /shoplab/dev/eval-db-password
---
# Shared token authorizing POST/GET /api/eval/runs and GET /api/eval/settings from shoplab-eval (LAB-31, LAB-130).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eval-service-eval
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: eval-service-eval
  data:
    - secretKey: SHOPLAB_EVAL_PERSISTENCE_TOKEN
      remoteRef:
        key: /shoplab/dev/eval
        property: EVAL_PERSISTENCE_TOKEN
