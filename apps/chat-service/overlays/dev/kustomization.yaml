# Dev of chat-service (LAB-59). `images:` is updated by the deploy job of shoplab-chat-service on every release;
# the name must be the full image name or that job refuses to update it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shoplab-dev

resources:
- ../../base
- networkpolicy.yaml

images:
- name: ghcr.io/leandroamariles/chat-service
  newName: ghcr.io/leandroamariles/chat-service
  newTag: v0.1.0
