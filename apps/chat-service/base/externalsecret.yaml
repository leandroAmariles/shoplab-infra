# Password of the role `chat` in PostgreSQL: matches CHAT_DB_PASSWORD of shoplab-helpdesk/infra/.env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-service-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: chat-service-db
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /shoplab/dev/chat-db-password
---
# Virtual key of chat-service at the LiteLLM model gateway.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-service-litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: chat-service-litellm
  data:
    - secretKey: SPRING_AI_OPENAI_API_KEY
      remoteRef:
        key: /shoplab/dev/litellm
        property: LITELLM_KEY_CHAT
---
# Langfuse project keys for OTLP traces (LAB-64) and versioned prompts (LAB-85).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chat-service-langfuse
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: chat-service-langfuse
  data:
    - secretKey: SHOPLAB_CHAT_TRACING_PUBLIC_KEY
      remoteRef:
        key: /shoplab/dev/langfuse
        property: LANGFUSE_INIT_PROJECT_PUBLIC_KEY
    - secretKey: SHOPLAB_CHAT_TRACING_SECRET_KEY
      remoteRef:
        key: /shoplab/dev/langfuse
        property: LANGFUSE_INIT_PROJECT_SECRET_KEY
