# Dev del gateway (LAB-107). `images:` lo actualiza el job de despliegue de shoplab-gateway con cada release; no se
# edita a mano. Una ruta se mueve a su servicio añadiendo SHOPLAB_GATEWAY_ROUTES_<NOMBRE>_URI al configMapGenerator
# (el nombre del ConfigMap cambia y el pod se reinicia solo). Guía: docs/fases/F5-mover-rutas-al-gateway.md de
# shoplab-helpdesk.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: shoplab-dev

resources:
- ../../base

configMapGenerator:
- literals:
  # LAB-129: documents and knowledge are served by retrieval-service.
  - SHOPLAB_GATEWAY_ROUTES_DOCUMENTS_URI=http://retrieval-service:8080
  - SHOPLAB_GATEWAY_ROUTES_KNOWLEDGE_URI=http://retrieval-service:8080
  # LAB-59: chat, feedback and assistant settings are served by chat-service.
  - SHOPLAB_GATEWAY_ROUTES_CHAT_URI=http://chat-service:8080
  - SHOPLAB_GATEWAY_ROUTES_ASSISTANT_URI=http://chat-service:8080
  # LAB-130: the evaluation history is served by eval-service. Revert this commit to go back to the monolith.
  - SHOPLAB_GATEWAY_ROUTES_EVAL_URI=http://eval-service:8080
  name: gateway-config

# LAB-130: el nodo de dev no tiene CPU libre (1930m asignables). Con 100m de petición ClickHouse no cabía y un rollout
# quedaba Pending. El pod viejo sale primero: con una réplica, el gateway se corta unos segundos en cada rollout.
patches:
- target:
    kind: Deployment
    name: gateway
  patch: |-
    - op: add
      path: /spec/strategy
      value:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 50m

images:
- name: ghcr.io/leandroamariles/gateway
  newName: ghcr.io/leandroamariles/gateway
  newTag: v0.1.0
